[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "chordsym"
version = "0.0.5"
description = "Chord symbols without dependencies: parse, pitch classes, key estimation, transposition"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["music", "chords", "transposition", "harmony"]
authors = [{ name = "Thor Whalen" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/thorwhalen/chordsym"
Repository = "https://github.com/thorwhalen/chordsym"
Documentation = "https://thorwhalen.github.io/chordsym"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "ruff>=0.1.0"]

[tool.hatch.build.targets.wheel]
packages = ["chordsym"]
# Twin tooling (codegen, fixture runner) is for the repository, not for users.
exclude = ["chordsym/_codegen.py", "chordsym/_fixtures.py"]

[tool.hatch.build.targets.sdist]
# The TypeScript twin ships to npm, not in the Python sdist; the fixtures do (tests read them).
exclude = ["ts/"]

[tool.ruff.lint]
select = ["D100"]

[tool.pytest.ini_options]
testpaths = ["tests", "chordsym"]
pythonpath = ["."]
addopts = "--doctest-modules"
doctest_optionflags = ["NORMALIZE_WHITESPACE", "ELLIPSIS"]

[tool.wads.ci]
project_name = ""

[tool.wads.ci.quality.ruff]
enabled = true

[tool.wads.ci.testing]
enabled = true
python_versions = ["3.10", "3.12"]
pytest_args = ["-v", "--tb=short", "--doctest-modules"]
coverage_enabled = true
coverage_threshold = 0
coverage_report_format = ["term", "xml"]
test_on_windows = true

[tool.wads.ci.build]
sdist = true
wheel = true

[tool.wads.ci.publish]
enabled = true
skip_ci_marker = "[skip ci]"
publish_marker = "[publish]"

# The npm twin (ts/package.json) carries the same version as the PyPI release
# that holds the same code: the publish job writes it at each release.
[tool.wads.ci.version]
sync = ["ts/package.json"]

# The Python CI ignores ts/ (the npm twin has its own CI), except the grammar the
# Python side generates there, which the Python tests check is current.
[tool.wads.ci.trigger]
include_paths = ["ts/src/grammar.generated.ts"]

[tool.wads.ci.docs]
enabled = true
builder = "epythet"
